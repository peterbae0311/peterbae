<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <!-- 상대경로 리소스(style.css, app.js 등)가 항상 /image_slideshow/ 기준으로 풀리도록 고정.
       hub에 얹혀 로컬 테스트할 때 주소창이 트레일링 슬래시 없이 /image_slideshow로 남는 경우
       상대경로가 루트(/) 기준으로 잘못 풀려 전부 404 나던 문제를 해결함. 운영 배포 시에도
       이미 이 경로이므로 동작 변화 없음. -->
  <base href="/image_slideshow/">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>앨범</title>
  <link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
  <link rel="stylesheet" as="style" crossorigin
        href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="auth/auth.css">
</head>
<body>

<!-- ===================== APP SETTINGS MODAL ===================== -->
<div id="app-settings-modal" class="modal-overlay" style="display:none">
  <div class="modal-box settings-box">
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="modal-emoji">⚙️</span>
        <div>
          <h2>설정</h2>
          <p class="modal-subtitle">슬라이드쇼와 음악을 설정하세요</p>
        </div>
      </div>
      <button class="btn-close" id="btn-close-app-settings">✕</button>
    </div>
    <div class="modal-body">
      <div class="modal-section-card">
        <div class="modal-section-label">
          <span class="label-dot"></span>
          전환 시간
        </div>
        <select id="pano-speed-select" class="select-input">
          <option value="2000">2초</option>
          <option value="3000" selected>3초</option>
          <option value="5000">5초</option>
          <option value="8000">8초</option>
          <option value="10000">10초</option>
        </select>
      </div>
      <div class="modal-section-card">
        <div class="modal-section-label">
          <span class="label-dot"></span>
          전환 효과
        </div>
        <select id="pano-effect-select" class="select-input">
          <option value="fade">페이드</option>
          <option value="slide">슬라이드</option>
          <option value="push">푸시</option>
          <option value="zoom">줌</option>
          <option value="zoomout">줌아웃</option>
          <option value="kenburns">켄번즈</option>
          <option value="rotate">회전</option>
          <option value="flip">플립</option>
          <option value="swing">스윙</option>
          <option value="wipe">와이프</option>
          <option value="blur">블러</option>
          <option value="glitch">글리치</option>
        </select>
      </div>
      <div class="modal-section-card">
        <div class="modal-section-label">
          <span class="label-dot"></span>
          배경 음악
        </div>
        <div class="settings-music-row">
          <button id="cfg-btn-play-stop" class="pano-ctrl-btn" title="재생/정지">▶</button>
          <input type="range" id="cfg-volume-slider" class="pano-volume-slider" min="0" max="1" step="0.05" value="0.7">
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== ADD ALBUM MODAL ===================== -->
<div id="add-modal" class="modal-overlay" style="display:none">
  <div class="modal-box add-box">
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="modal-emoji" id="add-modal-emoji">📁</span>
        <div>
          <h2 id="add-modal-title">새 앨범 추가</h2>
          <p class="modal-subtitle" id="add-modal-subtitle">사진과 배경 음악을 선택해주세요</p>
        </div>
      </div>
      <button class="btn-close" id="btn-close-add">✕</button>
    </div>
    <div class="modal-body modal-scroll">

      <!-- 앨범 명칭 + 일자 -->
      <div class="modal-section-card">
        <div class="modal-section-label">
          <span class="label-dot"></span>
          앨범 명칭 &amp; 일자
        </div>
        <div class="form-group" style="margin-bottom:10px">
          <div class="input-with-count">
            <input type="text" id="input-album-name" placeholder="앨범 이름을 입력하세요" maxlength="200">
            <span class="char-count"><span id="name-char-count">0</span>/200</span>
          </div>
        </div>
        <div class="form-group" style="margin-bottom:0">
          <input type="date" id="input-album-date" class="select-input" style="width:auto">
        </div>
      </div>

      <!-- 사진 업로드 -->
      <div class="modal-section-card">
        <div class="modal-section-label">
          <span class="label-dot"></span>
          사진 업로드
        </div>
        <div class="form-group">
          <div id="drop-zone" class="drop-zone">
            <input type="file" id="file-input" multiple accept="image/*" style="display:none">
            <div class="drop-icon">📷</div>
            <p class="drop-text">클릭하거나 드래그하여 사진 추가</p>
            <p class="drop-hint">JPG, PNG, WEBP · 여러 장 동시 선택 가능</p>
          </div>
          <div id="photo-preview-grid" class="photo-preview-grid"></div>
        </div>
      </div>

      <!-- 배경 음악 -->
      <div class="modal-section-card">
        <div class="modal-section-label">
          <span class="label-dot"></span>
          배경 음악
        </div>
        <div id="modal-music-list" class="modal-music-list"></div>
        <button id="btn-add-music" class="btn-add-music" type="button">＋ 음악 추가</button>
      </div>

    </div>
    <div class="modal-footer">
      <button class="btn-secondary" id="btn-cancel-add">취소</button>
      <button id="btn-save-album" class="btn-primary">
        <span id="save-btn-label">저장</span>
        <div id="save-spinner" class="spinner" style="display:none"></div>
      </button>
    </div>
  </div>
</div>

<!-- ===================== MUSIC PICKER MODAL ===================== -->
<div id="music-picker-modal" class="modal-overlay music-picker-overlay" style="display:none">
  <div class="modal-box music-picker-box">
    <div class="modal-header">
      <div class="modal-title-group">
        <span class="modal-emoji" style="background:var(--grad-brand)">🎵</span>
        <div>
          <h2>배경 음악 선택</h2>
          <p class="modal-subtitle">추가할 음악을 선택해주세요</p>
        </div>
      </div>
      <button class="btn-close" id="btn-close-music-picker">✕</button>
    </div>
    <div class="modal-body modal-scroll">
      <!-- 유형 탭 -->
      <div class="music-source-tabs">
        <button class="music-tab active" id="mptab-file" type="button">📂 음악 파일</button>
        <button class="music-tab" id="mptab-ai"   type="button">🤖 AI 제공</button>
      </div>

      <!-- 음악 파일 섹션 -->
      <div id="mp-file-section" style="margin-top:14px">
        <input type="file" id="mp-file-input" accept="audio/*" style="display:none" multiple>
        <button id="btn-mp-file" class="btn-local-music" type="button">
          📂 음악 파일 선택 (MP3, WAV, OGG 등)
        </button>
        <p class="drop-hint" style="margin-top:8px;text-align:center">파일을 선택하면 자동으로 추가됩니다</p>
      </div>

      <!-- AI 제공 섹션 -->
      <div id="mp-ai-section" style="display:none; margin-top:14px">
        <select id="mp-category-select" class="select-input">
          <option value="">카테고리를 선택하세요</option>
          <option>클래식</option>
          <option>재즈</option>
          <option>자연/힐링</option>
          <option>팝</option>
          <option>명상</option>
        </select>
        <div id="mp-music-list" class="music-list-container" style="display:none; margin-top:8px">
          <div id="mp-music-items"></div>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- ===================== MAIN APP ===================== -->
<!-- 플로팅 패널 토글 버튼 (접혔을 때 표시) -->
<button id="panel-float-btn" class="panel-float-btn" title="패널 펼치기">
  <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
</button>

<div id="app" class="app-container" style="display:none;">

  <!-- LEFT PANEL 30% -->
  <aside class="left-panel">
    <div class="left-header">
      <div class="brand">
        <button class="brand-icon-btn" id="btn-collapse-panel" title="패널 접기">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="opacity:.7"><rect x="3" y="3" width="18" height="18" rx="3"/><line x1="9" y1="3" x2="9" y2="21"/></svg>
        </button>
        <span class="brand-name">앨범</span>
      </div>
      <button id="btn-add" class="btn-add">
        <span class="btn-add-icon">+</span> 추가
      </button>
    </div>

    <div class="list-header">
      <span class="list-title">앨범 목록</span>
      <span id="record-count" class="record-count-badge">0개</span>
    </div>

    <div id="record-list" class="record-list">
      <div class="list-empty">
        <div class="list-empty-icon">🗂️</div>
        <p>앨범이 없습니다</p>
        <p class="list-empty-sub">+ 추가 버튼으로 시작하세요</p>
      </div>
    </div>

    <div class="left-bottom">
      <button class="btn-settings" id="btn-logout" title="로그아웃">🚪 로그아웃</button>
    </div>
  </aside>

  <!-- RIGHT PANEL 70% -->
  <main class="right-panel">

    <!-- Empty state -->
    <div id="empty-right" class="empty-right">
      <span class="empty-illustration">🌄</span>
      <h3 class="empty-title">앨범을 시작해보세요</h3>
      <p class="empty-desc">좌측에서 앨범을 선택하면<br>사진이 펼쳐집니다</p>
    </div>

    <!-- Panorama view -->
    <div id="panorama-view" class="panorama-view" style="display:none">

      <!-- 슬라이드쇼 뷰어 (호버 시 좌/우 이동 + 전체화면 아이콘 노출) — 이미지만 표시 -->
      <div id="pano-strip-wrap" class="pano-strip-wrap">
        <div id="pano-layer-a" class="pano-slide-layer" style="z-index:2"></div>
        <div id="pano-layer-b" class="pano-slide-layer" style="opacity:0;z-index:1"></div>
        <button id="btn-slide-prev" class="stage-nav-arrow stage-nav-prev" title="이전">❮</button>
        <button id="btn-slide-next" class="stage-nav-arrow stage-nav-next" title="다음">❯</button>
        <button id="btn-pano-fullscreen" class="stage-nav-arrow stage-fullscreen-btn" title="전체화면">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3m18 0V5a2 2 0 0 0-2-2h-3m0 18h3a2 2 0 0 0 2-2v-3M3 16v3a2 2 0 0 0 2 2h3"/></svg>
        </button>
      </div>

    </div>

  </main>
</div>

<!-- Toast -->
<div id="toast" class="toast"></div>

<script src="app.js"></script>
<script type="module">
  import { initAuth } from './auth/auth.js';

  const { supabase, signOut } = await initAuth({
    supabaseUrl: window.APP_CONFIG.supabaseUrl,
    supabaseKey: window.APP_CONFIG.supabaseKey,
    onLogin(user) {
      window.currentUser = user;
      document.getElementById('app').style.display = 'flex';
      window.initApp();
    },
    onLogout() {
      document.getElementById('app').style.display = 'none';
    },
  });

  // app.js가 /api/image-slideshow/* 호출 시 Authorization 헤더를 만들 때 재사용
  window._authSupabase = supabase;

  document.getElementById('btn-logout')?.addEventListener('click', signOut);
</script>
</body>
</html>
