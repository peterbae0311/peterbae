name: Build and deploy

# 왜 GitHub Actions에서 빌드하는가: Oracle 서버가 물리 RAM 500MB짜리 무료
# 인스턴스라 `next build`(특히 TypeScript 타입체킹 단계)를 서버에서 직접 돌리면
# V8 힙 한도에 걸려 OOM으로 크래시한 적이 있다. 빌드는 메모리가 넉넉한
# GitHub 호스팅 러너에서 하고, 성공한 빌드 산출물만 서버로 옮긴다.

on:
  # 2026-07-31: 전체 15개 job 수동 실행으로 검증 완료(런 30596595192) — push 트리거 활성화.
  push:
    branches: [main]
  workflow_dispatch: {}

env:
  DEPLOY_HOST: peterbae.duckdns.org
  DEPLOY_USER: opc

jobs:
  # 어느 앱 폴더가 바뀌었는지 감지해서, 바뀐 앱 job만 돌게 한다.
  # workflow_dispatch(수동 실행)는 "전체 강제 재배포" 용도로 항상 전체를 돌린다.
  changes:
    runs-on: ubuntu-latest
    outputs:
      career: ${{ steps.filter.outputs.career }}
      lottery: ${{ steps.filter.outputs.lottery }}
      newsclip: ${{ steps.filter.outputs.newsclip }}
      us_stock_market: ${{ steps.filter.outputs.us_stock_market }}
      expo: ${{ steps.filter.outputs.expo }}
      hub: ${{ steps.filter.outputs.hub }}
      image_slideshow: ${{ steps.filter.outputs.image_slideshow }}
      image_studio: ${{ steps.filter.outputs.image_studio }}
      Instructor_Expertise: ${{ steps.filter.outputs['Instructor_Expertise'] }}
      My-Claude: ${{ steps.filter.outputs['My-Claude'] }}
      audio_translate: ${{ steps.filter.outputs.audio_translate }}
      course_planning: ${{ steps.filter.outputs.course_planning }}
      manage_instructor: ${{ steps.filter.outputs.manage_instructor }}
      outside_instructor: ${{ steps.filter.outputs.outside_instructor }}
      manage_token: ${{ steps.filter.outputs.manage_token }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            career:
              - 'career/**'
              - '.github/workflows/deploy.yml'
              - 'deploy/remote-swap.sh'
            lottery:
              - 'lottery/**'
              - '.github/workflows/deploy.yml'
              - 'deploy/remote-swap.sh'
            newsclip:
              - 'newsclip/**'
              - '.github/workflows/deploy.yml'
              - 'deploy/remote-swap.sh'
            us_stock_market:
              - 'us_stock_market/**'
              - '.github/workflows/deploy.yml'
              - 'deploy/remote-swap.sh'
            expo:
              - 'expo/**'
              - '.github/workflows/deploy.yml'
              - 'deploy/remote-swap.sh'
            hub:
              - 'hub/**'
              - '.github/workflows/deploy.yml'
              - 'deploy/remote-swap.sh'
            image_slideshow:
              - 'image_slideshow/**'
              - '.github/workflows/deploy.yml'
            image_studio:
              - 'image_studio/**'
              - '.github/workflows/deploy.yml'
            Instructor_Expertise:
              - 'Instructor_Expertise/**'
              - '.github/workflows/deploy.yml'
            My-Claude:
              - 'My-Claude/**'
              - '.github/workflows/deploy.yml'
            audio_translate:
              - 'audio_translate/**'
              - '.github/workflows/deploy.yml'
            course_planning:
              - 'course_planning/**'
              - '.github/workflows/deploy.yml'
            manage_instructor:
              - 'manage_instructor/**'
              - '.github/workflows/deploy.yml'
            outside_instructor:
              - 'outside_instructor/**'
              - '.github/workflows/deploy.yml'
            manage_token:
              - 'manage_token/**'
              - '.github/workflows/deploy.yml'

  career:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.career == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: career/package-lock.json
      - name: Install
        working-directory: career
        run: npm ci
      - name: Write build-time env
        working-directory: career
        run: echo "${{ secrets.CAREER_ENV }}" > .env
      - name: Build
        working-directory: career
        run: npm run build
      - name: Prune dev dependencies
        working-directory: career
        run: npm prune --omit=dev
      - name: Package artifact
        working-directory: career
        run: tar -czf ../career.tar.gz .next package.json package-lock.json next.config.js node_modules $( [ -d public ] && echo public )
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/deploy"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy/remote-swap.sh "$DEPLOY_USER@$DEPLOY_HOST:~/deploy/remote-swap.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key career.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/career.tar.gz"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/deploy/remote-swap.sh career /tmp/career.tar.gz"

  lottery:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.lottery == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: lottery/package-lock.json
      - name: Install
        working-directory: lottery
        run: npm ci
      - name: Write build-time env
        working-directory: lottery
        run: echo "${{ secrets.LOTTERY_ENV }}" > .env
      - name: Build
        working-directory: lottery
        run: npm run build
      - name: Prune dev dependencies
        working-directory: lottery
        run: npm prune --omit=dev
      - name: Package artifact
        working-directory: lottery
        run: tar -czf ../lottery.tar.gz .next package.json package-lock.json next.config.js node_modules $( [ -d public ] && echo public )
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/deploy"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy/remote-swap.sh "$DEPLOY_USER@$DEPLOY_HOST:~/deploy/remote-swap.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key lottery.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/lottery.tar.gz"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/deploy/remote-swap.sh lottery /tmp/lottery.tar.gz"

  newsclip:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.newsclip == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: newsclip/package-lock.json
      - name: Install
        working-directory: newsclip
        run: npm ci
      - name: Write build-time env
        working-directory: newsclip
        run: echo "${{ secrets.NEWSCLIP_ENV }}" > .env
      - name: Build
        working-directory: newsclip
        run: npm run build
      - name: Prune dev dependencies
        working-directory: newsclip
        run: npm prune --omit=dev
      - name: Package artifact
        working-directory: newsclip
        run: tar -czf ../newsclip.tar.gz .next package.json package-lock.json next.config.js node_modules $( [ -d public ] && echo public )
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/deploy"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy/remote-swap.sh "$DEPLOY_USER@$DEPLOY_HOST:~/deploy/remote-swap.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key newsclip.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/newsclip.tar.gz"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/deploy/remote-swap.sh newsclip /tmp/newsclip.tar.gz"

  us_stock_market:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.us_stock_market == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: us_stock_market/package-lock.json
      - name: Install
        working-directory: us_stock_market
        run: npm ci
      - name: Write build-time env
        working-directory: us_stock_market
        run: echo "${{ secrets.US_STOCK_MARKET_ENV }}" > .env
      - name: Build
        working-directory: us_stock_market
        run: npm run build
      - name: Prune dev dependencies
        working-directory: us_stock_market
        run: npm prune --omit=dev
      - name: Package artifact
        working-directory: us_stock_market
        run: tar -czf ../us_stock_market.tar.gz .next package.json package-lock.json next.config.js node_modules $( [ -d public ] && echo public )
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/deploy"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy/remote-swap.sh "$DEPLOY_USER@$DEPLOY_HOST:~/deploy/remote-swap.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key us_stock_market.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/us_stock_market.tar.gz"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/deploy/remote-swap.sh us_stock_market /tmp/us_stock_market.tar.gz"

  expo:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.expo == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: expo/web/package-lock.json
      - name: Install
        working-directory: expo/web
        run: npm ci
      - name: Write build-time env
        working-directory: expo/web
        run: echo "${{ secrets.EXPO_ENV }}" > .env
      - name: Build
        working-directory: expo/web
        run: npm run build
      - name: Prune dev dependencies
        working-directory: expo/web
        run: npm prune --omit=dev
      - name: Package artifact
        working-directory: expo/web
        run: tar -czf ../../expo.tar.gz .next package.json package-lock.json next.config.js node_modules $( [ -d public ] && echo public )
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/deploy"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy/remote-swap.sh "$DEPLOY_USER@$DEPLOY_HOST:~/deploy/remote-swap.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key expo.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/expo.tar.gz"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/deploy/remote-swap.sh expo /tmp/expo.tar.gz"

  hub:
    needs: changes
    if: github.event_name != 'push' || needs.changes.outputs.hub == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: hub/package-lock.json
      - name: Install
        working-directory: hub
        run: npm ci
      - name: Write build-time env
        working-directory: hub
        run: echo "${{ secrets.HUB_ENV }}" > .env
      - name: Build
        working-directory: hub
        run: npm run build
      - name: Prune dev dependencies
        working-directory: hub
        run: npm prune --omit=dev
      - name: Package artifact
        working-directory: hub
        run: tar -czf ../hub.tar.gz .next package.json package-lock.json next.config.js node_modules $( [ -d public ] && echo public )
      - name: Deploy
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p ~/deploy"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key deploy/remote-swap.sh "$DEPLOY_USER@$DEPLOY_HOST:~/deploy/remote-swap.sh"
          scp -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key hub.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/hub.tar.gz"
          ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key "$DEPLOY_USER@$DEPLOY_HOST" "bash ~/deploy/remote-swap.sh hub /tmp/hub.tar.gz"

  # 빌드가 필요 없는 정적 HTML 사이트 9개 — nginx 문서 루트로 직접 rsync.
  # /usr/share/nginx/html은 root 소유라 원격에서 sudo rsync로 실행.
  static-sites:
    needs: changes
    runs-on: ubuntu-latest
    strategy:
      matrix:
        site:
          - image_slideshow
          - image_studio
          - My-Claude
          - audio_translate
          - course_planning
          - manage_instructor
          - outside_instructor
          - manage_token
          - Instructor_Expertise
    steps:
      - uses: actions/checkout@v4
      - name: Deploy static site
        if: github.event_name != 'push' || needs.changes.outputs[matrix.site] == 'true'
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          rsync -az --delete \
            -e "ssh -o StrictHostKeyChecking=no -i ~/.ssh/deploy_key" \
            --rsync-path="sudo rsync" \
            "${{ matrix.site }}/" "$DEPLOY_USER@$DEPLOY_HOST:/usr/share/nginx/html/${{ matrix.site }}/"
