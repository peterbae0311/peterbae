name: Expo Data Sync

# 왜 필요한가: 이 워크플로우는 원래 expo/.github/workflows/sync.yml에 있었는데,
# 그건 expo가 독립 저장소였을 때 얘기다. GitHub Actions는 레포 루트의
# .github/workflows/만 인식하므로, 모노레포로 합쳐진 뒤로는 이 파일이
# (경로만 다를 뿐 내용은 그대로) 한 번도 실행되지 않고 있었다.

on:
  schedule:
    # 매일 05:00 KST(UTC 20:00, 전날) 1회 — exh_sources.call_interval_minutes(1440=1일)와 동일 주기
    - cron: "0 20 * * *"
  workflow_dispatch:
    inputs:
      source:
        description: "동기화할 소스 코드 (기본값 all)"
        required: false
        default: "all"

concurrency:
  group: exh-data-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: expo/package-lock.json

      - run: npm ci

      - name: Run sync
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CULTURE_PORTAL_SERVICE_KEY: ${{ secrets.CULTURE_PORTAL_SERVICE_KEY }}
          CULTURE_DATA_PLAZA_EXPO_SERVICE_KEY: ${{ secrets.CULTURE_DATA_PLAZA_EXPO_SERVICE_KEY }}
          CULTURE_DATA_PLAZA_PERF_SERVICE_KEY: ${{ secrets.CULTURE_DATA_PLAZA_PERF_SERVICE_KEY }}
          SEOUL_CULTURE_EVENT_SERVICE_KEY: ${{ secrets.SEOUL_CULTURE_EVENT_SERVICE_KEY }}
          KOTRA_OVERSEAS_FAIR_SERVICE_KEY: ${{ secrets.KOTRA_OVERSEAS_FAIR_SERVICE_KEY }}
          TOUR_API_FESTIVAL_SERVICE_KEY: ${{ secrets.TOUR_API_FESTIVAL_SERVICE_KEY }}
        run: npm run sync -- ${{ github.event.inputs.source || 'all' }}
